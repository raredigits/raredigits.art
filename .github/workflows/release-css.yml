name: Release Rare Styles

# Validated, version-triggered CSS release (CSS-348). Replaces sync-css.yml,
# which copied assets/css/* into raredigits/rare-styles on every push to main
# with no install, lint, test or build — an ungated or broken rare.css could
# reach the repository that jsDelivr serves.
#
# A release happens only when _data/versions.js names a `styles` version that
# is not tagged in rare-styles yet (same rule as sync-charts.yml). The artifact
# is built and verified ONCE, uploaded, then that exact artifact is published,
# tagged and compared byte for byte with the pinned jsDelivr URL. Ordinary
# pushes between releases change nothing in rare-styles.
#
# To release: bump _data/versions.js + package.json, add the Changelog entry,
# rebuild (npm run build:css), merge to main.
# Manual run (workflow_dispatch) = dry run: every check and the staged
# artifact, no publishing.

on:
  push:
    branches: [main]
    paths:
      - '_data/versions.js'
      - 'package.json'
      - 'assets/css/**'
      - 'scripts/build-css.mjs'
      - 'scripts/rd-gate*.mjs'
      - 'scripts/release-css.mjs'
  workflow_dispatch:

# One release at a time; never cancel a release half way.
concurrency:
  group: release-rare-styles
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # size-report --check recomputes rows from older commits

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Version, package and changelog agree
        id: version
        run: |
          VERSION=$(node scripts/release-css.mjs check)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags https://github.com/raredigits/rare-styles.git "refs/tags/$VERSION" > /dev/null; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "$VERSION is already released — dry run of the checks only."
            else
              echo "release=skip" >> "$GITHUB_OUTPUT"
              echo "$VERSION is already tagged in rare-styles — nothing to release. Bump _data/versions.js to release."
            fi
          else
            echo "release=${{ github.event_name == 'push' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "$VERSION is not tagged in rare-styles yet."
          fi

      - name: Lint
        if: steps.version.outputs.release != 'skip'
        run: npm run lint:css

      - name: Unit, gate and compiled-CSS tests (artifacts must equal a fresh build)
        if: steps.version.outputs.release != 'skip'
        run: npx vitest run

      - name: Browser checks (headless Google Chrome)
        if: steps.version.outputs.release != 'skip'
        run: npm run test:browser

      - name: Size baseline reproduces
        if: steps.version.outputs.release != 'skip'
        run: node scripts/size-report.mjs --check

      - name: Site builds and has no broken internal links
        if: steps.version.outputs.release != 'skip'
        run: npm run check:links

      - name: Stage the release artifact
        if: steps.version.outputs.release != 'skip'
        run: node scripts/release-css.mjs stage dist/rare-styles

      - name: Upload the artifact (also the self-hosting package)
        if: steps.version.outputs.release != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: rare-styles-${{ steps.version.outputs.version }}
          path: dist/rare-styles
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  publish:
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the verified artifact
        uses: actions/download-artifact@v4
        with:
          name: rare-styles-${{ needs.verify.outputs.version }}
          path: dist/rare-styles

      - name: Clone rare-styles
        run: git clone https://x-access-token:${{ secrets.RARE_STYLES_PAT }}@github.com/raredigits/rare-styles.git temp-rare-styles

      - name: Refuse to reuse a tag
        working-directory: temp-rare-styles
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::$VERSION is already tagged in rare-styles — tags are immutable, bump the version."
            exit 1
          fi

      - name: Replace the tree with the artifact
        run: |
          rsync -a --delete \
            --exclude '.git' --exclude 'LICENSE' --exclude 'README.md' --exclude '.nojekyll' \
            dist/rare-styles/ temp-rare-styles/

      - name: Commit, tag and push atomically
        working-directory: temp-rare-styles
        run: |
          git config user.name "Rare Release Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Rare Styles $VERSION" || echo "Tree unchanged — tagging the current state"
          git tag -a "$VERSION" -m "Rare Styles $VERSION"
          git push --atomic origin main "refs/tags/$VERSION"

      - name: Create the GitHub Release with the self-hosting archive
        run: |
          TITLE=$(grep -m1 -F "## [$VERSION]" assets/css/docs/Changelog.md | sed -E 's/^## \[//; s/\] — [0-9]{4}-[0-9]{2}-[0-9]{2} — / — /')
          [ -n "$TITLE" ] || TITLE="$VERSION"
          awk -v ver="$VERSION" 'index($0, "## [" ver "]")==1{f=1; next} /^## \[/{f=0} f' \
            assets/css/docs/Changelog.md > /tmp/relnotes.md
          printf '\nMigration: https://github.com/raredigits/rare-styles/blob/%s/docs/MIGRATION.md\n' "$VERSION" >> /tmp/relnotes.md
          tar -czf "/tmp/rare-styles-$VERSION.tar.gz" -C dist rare-styles
          RELEASE_ID=$(jq -n --arg tag "$VERSION" --arg title "$TITLE" --rawfile body /tmp/relnotes.md \
              '{tag_name: $tag, name: $title, body: $body, make_latest: "true"}' \
            | curl -sf -X POST \
                -H "Authorization: Bearer ${{ secrets.RARE_STYLES_PAT }}" \
                -H "Accept: application/vnd.github+json" \
                -d @- "https://api.github.com/repos/raredigits/rare-styles/releases" | jq -r .id)
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.RARE_STYLES_PAT }}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@/tmp/rare-styles-$VERSION.tar.gz" \
            "https://uploads.github.com/repos/raredigits/rare-styles/releases/$RELEASE_ID/assets?name=rare-styles-$VERSION.tar.gz" > /dev/null
          echo "Released $TITLE"

  verify-cdn:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download the verified artifact
        uses: actions/download-artifact@v4
        with:
          name: rare-styles-${{ needs.verify.outputs.version }}
          path: dist/rare-styles

      # Do not recommend the pinned URL until jsDelivr serves exactly the
      # bytes that were verified (retries while the CDN picks up the tag).
      - name: Pinned jsDelivr bytes equal the artifact
        run: node scripts/release-css.mjs verify-cdn dist/rare-styles
